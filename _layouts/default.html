<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}{% if page.title %} · {% endif %}{{ site.title }}</title>

  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/images/favicon-192.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #efe7d8;      /* beige */
      --bg-story: #e9dfce; /* story panel beige */
      --ink: #3a3630;     /* warm dark */
      --muted: #8a8072;   /* soft gray-brown */
      --link: #7a5c3e;    /* muted brown */
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Cormorant Garamond", Garamond, Georgia, serif;
      font-size: 21px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 12vh 24px 15vh;
    }

    h1 {
      font-weight: 500;
      font-size: 2.4rem;
      line-height: 1.2;
      margin: 0 0 0.6em;
      letter-spacing: 0.2px;
    }

    h2 {
      font-weight: 500;
      font-size: 1.5rem;
      margin: 2em 0 0.5em;
    }

    h3 {
      font-weight: 500;
      font-size: 1.2rem;
      margin: 1.6em 0 0.45em;
    }

    p { margin: 0 0 1.1em; }

    a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid rgba(122, 92, 62, 0.35);
      transition: border-color 0.2s ease;
    }
    a:hover { border-bottom-color: var(--link); }

    .muted { color: var(--muted); }

    .story-lead {
      margin: 0 0 1.1em;
    }
    .story {
      display: inline;
      margin: 0;
    }
    .story-toggle {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      margin: 0 0 0 0.2em;
      vertical-align: middle;
      color: var(--link);
      user-select: none;
    }
    .story-toggle::-webkit-details-marker { display: none; }
    .story-toggle::marker { content: ""; }
    .story-chevron {
      display: inline-block;
      font-size: 1.05em;
      line-height: 1;
      transform: rotate(90deg);
      transition: transform 0.25s ease;
    }
    .story[open] .story-chevron {
      transform: rotate(-90deg);
    }
    .story-panel {
      display: block;
      margin: 0.95em 0 0;
      padding: 1.35em 1.25em 0.35em;
      background: var(--bg-story);
      border-radius: 2px;
    }
    .story-panel > :first-child { margin-top: 0; }
    .story-panel > :last-child { margin-bottom: 0.85em; }

    nav {
      margin-top: 3em;
      font-size: 0.95rem;
    }
    nav a { margin-right: 1.2em; }

    img { max-width: 100%; height: auto; }

    body.photos-page .wrap { max-width: 1200px; }

    .roll {
      position: relative;
      margin: 2.5em 0 0;
      outline: none;
    }
    .roll-stage {
      position: relative;
      height: min(70vh, 620px);
      perspective: 1500px;
    }
    .frame {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 82%;
      margin: 0;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    .frame img {
      height: 100%;
      width: auto;
      max-width: 62vw;
      display: block;
      background: #ddd4c4;
      box-shadow: 0 18px 50px rgba(45, 40, 34, 0.35);
    }

    .roll-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 60;
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 50%;
      background: rgba(239, 231, 216, 0.6);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      color: var(--ink);
      font-family: inherit;
      font-size: 2.4rem;
      line-height: 1;
      cursor: pointer;
      transition: background .2s ease;
    }
    .roll-nav:hover { background: rgba(239, 231, 216, 0.95); }
    .roll-nav.prev { left: 4px; }
    .roll-nav.next { right: 4px; }

    .contact {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .contact a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--ink);
      border-bottom: none;
      opacity: 0.82;
      transition: opacity 0.2s ease;
    }
    .contact a:hover {
      opacity: 1;
      border-bottom: none;
    }
    .contact svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .contact svg .icon-solid {
      fill: currentColor;
    }

    @media (max-width: 480px) {
      body { font-size: 18px; }
      .wrap { padding: 8vh 20px 10vh; }
      h1 { font-size: 2rem; }
      .roll-stage { height: 52vh; }
      .frame img { max-width: 82vw; }
      .roll-nav { width: 44px; height: 44px; font-size: 2rem; }
      .contact { top: 16px; right: 16px; gap: 12px; }
      .contact a { width: 26px; height: 26px; }
      .contact svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body class="{{ page.body_class }}">
  <nav class="contact" aria-label="Contact">
    <a href="{{ '/cv.pdf' | relative_url }}" aria-label="CV" title="CV">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M7 2h7l4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M14 2v4h4"/>
        <text x="12" y="15.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="7.5" font-weight="700" fill="currentColor">CV</text>
      </svg>
    </a>
    <a href="https://www.linkedin.com/in/victoria-vorderw%C3%BClbecke-90741a3a0" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-solid" d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4zm7.5 0h3.84v1.98h.05c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.14V23h-4v-6.57c0-1.57-.03-3.58-2.18-3.58-2.18 0-2.51 1.7-2.51 3.46V23h-4z"/></svg>
    </a>
    <a href="mailto:victoria.vdwb@outlook.com" aria-label="Email" title="Email">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-solid" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 3.2-8 5.2-8-5.2V6l8 5.2L20 6z"/></svg>
    </a>
  </nav>

  <main class="wrap">
    {{ content }}
  </main>

  <script>
    (function () {
      var roll = document.querySelector('.roll');
      if (!roll) return;
      var stage = roll.querySelector('.roll-stage');
      var frames = Array.prototype.slice.call(roll.querySelectorAll('.frame'));
      var N = frames.length;
      if (!N) return;

      var current = 0;
      var downX = 0, moved = 0, isDown = false;

      function place() {
        var step = stage.clientWidth * 0.26;
        for (var i = 0; i < N; i++) {
          var o = i - current;
          if (o > N / 2) o -= N;
          else if (o < -N / 2) o += N;
          var a = Math.abs(o);
          var sign = o > 0 ? 1 : (o < 0 ? -1 : 0);
          var x, s, ry, op, z;
          if (a === 0)      { x = 0;               s = 1.0;  ry = 0;           op = 1;    z = 40; }
          else if (a === 1) { x = sign * step;       s = 0.8;  ry = -sign * 26; op = 0.7;  z = 30; }
          else if (a === 2) { x = sign * step * 1.8; s = 0.62; ry = -sign * 30; op = 0.32; z = 20; }
          else              { x = sign * step * 2.5; s = 0.5;  ry = -sign * 32; op = 0;    z = 10; }
          var f = frames[i];
          f.style.transform = 'translate(-50%,-50%) translateX(' + x + 'px) rotateY(' + ry + 'deg) scale(' + s + ')';
          f.style.opacity = op;
          f.style.zIndex = z;
          f.style.pointerEvents = op > 0 ? 'auto' : 'none';
        }
      }

      function go(dir) { current = (current + dir + N) % N; place(); }

      roll.querySelector('.next').addEventListener('click', function () { go(1); });
      roll.querySelector('.prev').addEventListener('click', function () { go(-1); });

      frames.forEach(function (f, i) {
        f.addEventListener('click', function () {
          if (Math.abs(moved) > 8 || i === current) return;
          current = i; place();
        });
      });

      roll.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
      });

      stage.addEventListener('pointerdown', function (e) { isDown = true; downX = e.clientX; moved = 0; });
      stage.addEventListener('pointermove', function (e) { if (isDown) moved = e.clientX - downX; });
      window.addEventListener('pointerup', function () {
        if (!isDown) return;
        isDown = false;
        if (Math.abs(moved) > 40) go(moved < 0 ? 1 : -1);
      });

      var t;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(place, 120); });

      place();
    })();
  </script>
</body>
</html>
